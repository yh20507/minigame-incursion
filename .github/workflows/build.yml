name: Windows exe 빌드

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Supabase 설정 넣기 (저장소 Secrets 에 있으면)
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -n "$SUPABASE_URL" ]; then
            printf '{ "supabaseUrl": "%s", "supabaseAnonKey": "%s" }\n' "$SUPABASE_URL" "$SUPABASE_ANON_KEY" > public/config.json
          fi
      - run: npm run build && npx electron-builder --win --x64 -c.win.signAndEditExecutable=true
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: minigame-incursion-windows
          path: |
            release/*.exe
            release/*.zip
      - name: Releases 에 올리기 (태그로 실행했을 때)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.exe
            release/*.zip
